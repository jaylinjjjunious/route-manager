<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>Route Manager — connection needed</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #101820; color: #f1f5f9; }
    main { padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); max-width: 360px; }
    h1 { font-size: 28px; }
    p { line-height: 1.6; color: #cbd5e1; }
    a { display: inline-block; padding: 14px 22px; border-radius: 12px; background: #4ade80; color: #102019; font-weight: 700; text-decoration: none; }
    a:focus-visible { outline: 3px solid white; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Let’s reconnect</h1>
    <p>Route Manager couldn’t load. Check your internet connection and try again. The website may also be temporarily unavailable.</p>
    <a href="https://route-manager-phtj.onrender.com/">Try again</a>
  </main>
</body>
</html>
