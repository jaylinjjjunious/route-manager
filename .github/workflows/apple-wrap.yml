name: Apple iOS Wrap

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-wrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build Apple iOS Package
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Diagnostics — versions
        run: |
          echo "Node: $(node --version)"
          echo "npm:  $(npm --version)"
          echo "Capacitor CLI: $(npx cap --version)"
          echo "Xcode: $(xcodebuild -version | head -n 1)"
          xcode_major=$(xcodebuild -version | head -n 1 | awk '{print $2}' | cut -d. -f1)
          if [ "$xcode_major" -lt 26 ]; then
            echo "::error::Capacitor 8 requires Xcode 26 or newer. Select a compatible macOS runner."
            exit 1
          fi

      - name: Type check
        run: npm run lint

      - name: Build bundled iOS frontend
        run: npm run build:ios
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_ORIGIN: https://route-manager-phtj.onrender.com
          VITE_TRANSIT_PROVIDER: ${{ secrets.VITE_TRANSIT_PROVIDER || 'transit' }}

      - name: Sync Capacitor iOS platform
        run: npm run cap:sync

      - name: Diagnostics — Xcode project
        run: |
          xcodebuild -project ios/App/App.xcodeproj -list

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
                     -scheme App \
                     -resolvePackageDependencies

      - name: Build simulator application
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
                     -scheme App \
                     -configuration Debug \
                     -sdk iphonesimulator \
                     -destination 'generic/platform=iOS Simulator' \
                     -derivedDataPath build/simulator \
                     build CODE_SIGNING_ALLOWED=NO
          ditto -c -k --sequesterRsrc --keepParent \
            build/simulator/Build/Products/Debug-iphonesimulator/App.app \
            build/App-simulator.zip

      - name: Build Xcode Archive (.xcarchive)
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
                     -scheme App \
                     -configuration Release \
                     -sdk iphoneos \
                     -destination 'generic/platform=iOS' \
                     -archivePath build/App.xcarchive \
                     CURRENT_PROJECT_VERSION=${{ github.run_number }} \
                     archive \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO

      - name: Compress Archive Artifact
        run: |
          cd build
          zip -r App.xcarchive.zip App.xcarchive

      - name: Upload iOS Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apple-ios-archive
          path: build/App.xcarchive.zip
          retention-days: 14
          if-no-files-found: error

      - name: Upload simulator application
        uses: actions/upload-artifact@v4
        with:
          name: apple-ios-simulator
          path: build/App-simulator.zip
          retention-days: 14
          if-no-files-found: error
